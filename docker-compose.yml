services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: start-dev --import-realm --health-enabled=true --http-management-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HEALTH_ENABLED: true
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: false
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && timeout 2 cat <&3 | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  mcp-server:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MCP_SERVER_URL: http://localhost:3001
      AUTH_PROVIDER: keycloak
      KEYCLOAK_ISSUER: http://localhost:8080/realms/mcp
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  keycloak_data:
